name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reflect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reflect_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Fails the build on any critical vulnerability in a production
      # dependency. High and lower are listed in the log without failing.
      - name: Dependency audit
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --audit-level=critical

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      # Runs the built server and submits the Claude connector forms the way a
      # browser would (E-005, E-006).
      - name: Connector form test
        run: |
          npx drizzle-kit push --force
          npm run test:forms
