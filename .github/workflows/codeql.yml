name: CodeQL

# Scans the app's code for security bugs (injection, unsafe redirects,
# leaked data and similar) on every change and once a week. Findings show
# under the repo's Security tab and as checks on pull requests.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
